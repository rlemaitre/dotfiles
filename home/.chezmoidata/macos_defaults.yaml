  nabla-mac-raphael: []

macos_defaults_absent:
  # Keys deleted when present, so a Mac that ran the old set_defaults.sh ends up with macOS defaults
  # (they turned off the quarantine prompt and disk image checksum verification).
  common:
    - {domain: "com.apple.LaunchServices", key: "LSQuarantine"}
    - {domain: "com.apple.frameworks.diskimages", key: "skip-verify"}
    - {domain: "com.apple.frameworks.diskimages", key: "skip-verify-locked"}
    - {domain: "com.apple.frameworks.diskimages", key: "skip-verify-remote"}
  athena: []
  nabla-mac-raphael: []

macos_power:
  # sudo pmset values, applied by run_after_75_macos-power.sh when they differ (needs a terminal).
  # Minutes; 0 = never. The work laptop keeps its own policy.
  common: {}
  athena: {ac_sleep: 0, battery_sleep: 5, display_sleep: 15}
  nabla-mac-raphael: {}
