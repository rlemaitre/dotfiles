  gh_extensions:
    # `gh extension install <repo> --pin <tag>`, once `gh auth login` has been done
    common:
      - {repo: dlvhdr/gh-dash, pin: v4.26.2}
      - {repo: github/gh-stack, pin: v0.2.1}
    athena: []
    nabla-mac-raphael: []
  gh_skills:
    # Agent skills for Claude Code, user scope: `gh skill install <repo> <skill> --agent claude-code --scope user --pin <tag>`.
    # Installed to ~/.claude/skills/<skill> after `gh auth login`. Read a skill before adding it: it is instructions an agent follows.
    common:
      - {repo: github/gh-stack, skill: gh-stack, pin: v0.2.1}
    athena: []
    nabla-mac-raphael: []
  # TODO remove when `brew install jetbrains/utils/kotlin-lsp` works again: `mise run upstream-check` and docs/upstream-watch.md.
  # (upstream: github.com/Kotlin/kotlin-lsp issue 282, the formula's download returns 404).
  # Until then the server is installed from JetBrains' VS Code extension archive.
  kotlin_lsp:
    version: "263.6379.0"
    url: "https://download.jetbrains.com/language-server/kotlin-server/263.6379.0/kotlin-server-0.0.13-mac-aarch64.vsix"
    sha256: "bf31bf940546aeb15ad4d9361a0a3c32b796345d8af60d86aed551c1c7adface"
  # rustup components for the `rust` toolchain installed by mise.
  # rust-analyzer comes from rustup (not mise): ~/.cargo/bin/rust-analyzer is a rustup proxy that
  # shadows a mise copy in PATH, and the component matches the toolchain version.
  rustup_components:
    common: [rust-analyzer]
    athena: []
    nabla-mac-raphael: []
  # Quick Look preview extensions: `use` = enabled, `ignore` = disabled. Applied by run_after_55_quicklook-extensions.sh.
  # Two extensions claiming one content type (Markdown) leave the winner to macOS, so the loser is set to `ignore`.
  quicklook_extensions:
    common:
      - {id: "org.sbarex.QLMarkdown.QLExtension", appex: "/Applications/QLMarkdown.app/Contents/PlugIns/Markdown QL Extension.appex", state: use}
      - {id: "org.sbarex.SourceCodeSyntaxHighlight.QuickLookExtension", appex: "/Applications/Syntax Highlight.app/Contents/PlugIns/Syntax Highlight Quick Look Extension.appex", state: use}
      - {id: "md.obsidian.quicklook", appex: "/Applications/Obsidian.app/Contents/PlugIns/ObsidianQuickLook.appex", state: ignore}
    athena: []
    nabla-mac-raphael: []

# mise refuses an npm dependency whose release has weaker trust evidence than an earlier one (aube trust policy).
# Each entry exempts one reviewed package@version for one tool; a newer release is checked again.
# Reviews are in docs/upstream-watch.md.
mise_trust_policy_excludes:
  "npm:@mermaid-js/mermaid-cli":
    - "chromium-bidi@157.0.8090-0"
