      - "github:docker/buildx@0.38.1"
      - "github:docker/compose@5.6.1"
      - "glow@3.0.0"
      - "go@1.27.3"
      - "go:golang.org/x/tools/gopls@0.24.0"
      - "gum@2.0.2"
