# Single source of truth for installed packages.
# Install channel priority: mise, then brew formula, then brew cask, then mas.
# A tool must appear in exactly one channel per machine (checked by `mise run check`).
# Every machine key must exist in every section, even when empty.
# mise entries use mise CLI syntax: `name` (latest) or `name@version` (pinned).
packages:
  mise:
    common:
      - "atuin"
      - "bat"
      - "bun"
      - "chezmoi"
      - "cmake"
      - "colima"
      - "coursier"
      - "delta"
      - "deno"
      - "docker-cli"
      - "eza"
      - "fd"
      - "fzf"
      - "gh"
      - "github:docker/buildx"
      - "github:docker/compose"
      - "glow"
      - "go"
      - "go:golang.org/x/tools/gopls"
      - "gum"
      - "hexyl"
      - "java@oracle-graalvm-21.0.7"
      - "jq"
      - "just"
      - "lazydocker"
      - "lazygit"
      - "lima"
      - "lua-language-server"
      - "maven"
      - "neovim"
      - "node"
      - "npm:better-commits"
      - "npm:eslint"
      - "npm:prettier"
      - "npm:pyright"
      - "npm:tombi"
      - "npm:typescript"
      - "npm:typescript-language-server"
      - "oh-my-posh"
      - "pnpm@10.8.1"
      - "python@3.12"
      - "ripgrep"
      - "rtk"
      - "rust"
      - "sbt@1.10.11"
      - "shellcheck"
      - "shfmt"
      - "tree-sitter"
      - "uv"
      - "vivid"
      - "worktrunk"
      - "yarn"
      - "yq"
      - "zoxide"
    athena: []
    nabla-mac-raphael: []
  brew:
    taps:
      common: [theboredteam/boring-notch]
      athena: []
      nabla-mac-raphael: []
    formulae:
      common:
        - "bash"
        - "buku"
        - "coreutils"
        - "gnupg"
        - "jdtls"
        - "mas"
        - "mise"
        - "pinentry-mac"
        - "postgresql@18"
        - "usage"
        - "ykman"
        - "ykpers"
      # athena: unused or undecided, review
      athena:
        - "nnn"
        - "pkgconf"
        - "texinfo"
      nabla-mac-raphael: []
    casks:
      common:
        - "1password"
        - "adguard"
        - "beeper"
        - "boring-notch"
        - "brainfm"
        - "claude"
        - "claude-code"
        - "cmux"
        - "elgato-camera-hub"
        - "elgato-stream-deck"
        - "font-fira-code"
        - "font-fira-code-nerd-font"
        - "font-hack-nerd-font"
        - "ghostty"
        - "google-chrome"
        - "gpg-suite-no-mail"
        - "jetbrains-toolbox"
        - "mos"
        - "obsidian"
        - "qlmarkdown"
        - "raycast"
        - "sensiblesidebuttons"
        - "signal"
        - "the-unarchiver"
        - "yubico-authenticator"
        - "zed"
        - "zotero"
      athena:
        - "adguard-vpn"
        - "audio-hijack"
        - "autodesk-fusion"
        - "bambu-studio"
        - "betterdisplay"
        - "calibre"
        - "discord"
        - "displaylink"
        - "elgato-capture-device-utility"
        - "freedom"
        - "inkscape"
        - "logi-options+"
        - "loopback"
        - "macwhisper"
        - "mutedeck"
        - "native-access"
        - "openscad@snapshot"
        - "orion"
        - "pronotes"
        - "rekordbox"
        - "steam"
        - "vivaldi"
        - "vocaster-hub"
      nabla-mac-raphael: []
  mas:
    # App Store id: name
    common:
      "497799835": "Xcode"
      "1622835804": "Kagi for Safari"
      "1569813296": "1Password for Safari"
      "1664344174": "NEEWER Control Center"
      "6758070650": "Itsyhome"
      "361285480": "Keynote"
      "361304891": "Numbers"
      "361309726": "Pages"
    athena:
      "937984704": "Amphetamine"
      "1586435171": "Actions"
      "1545870783": "Color Picker"
      "1453273600": "Data Jar"
      "640199958": "Developer"
      "1099120373": "Exporter"
      "682658836": "GarageBand"
      "408981434": "iMovie"
      "302584613": "Kindle"
      "1437106857": "My Desires"
      "6720708363": "Obsidian Web Clipper"
      "1592826205": "Open Access Helper"
      "933627574": "Silicio"
      "1496833156": "Swift Playground"
    nabla-mac-raphael: {}
  gh_extensions:
    # owner/repo, installed once `gh auth login` has been done
    common: [dlvhdr/gh-dash, github/gh-stack]
    athena: []
    nabla-mac-raphael: []
  # TODO remove when `brew install jetbrains/utils/kotlin-lsp` works again
  # (upstream: github.com/Kotlin/kotlin-lsp issue 282, the formula's download returns 404).
  # Until then the server is installed from JetBrains' VS Code extension archive.
  kotlin_lsp:
    version: "263.6379.0"
    url: "https://download.jetbrains.com/language-server/kotlin-server/263.6379.0/kotlin-server-0.0.13-mac-aarch64.vsix"
    sha256: "bf31bf940546aeb15ad4d9361a0a3c32b796345d8af60d86aed551c1c7adface"
  # rustup components for the `rust` toolchain installed by mise.
  # rust-analyzer comes from rustup (not mise): ~/.cargo/bin/rust-analyzer is a rustup proxy that
  # shadows a mise copy in PATH, and the component matches the toolchain version.
  rustup_components:
    common: [rust-analyzer]
    athena: []
    nabla-mac-raphael: []
