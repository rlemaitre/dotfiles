[tools]
chezmoi = "latest"

[tasks.check]
description = "Lint shell scripts, check package duplicates, render every template for every machine"
run = '''
set -eu
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
shellcheck install.sh scripts/*.sh
shfmt -d -i 2 install.sh scripts/*.sh home/.chezmoiscripts/*.sh
scripts/check-packages.sh
python3 scripts/gen-tools-doc.py --check
python3 scripts/check-links.py
for f in $(find home -name '*.sh' -not -path '*/.chezmoiscripts/*'); do shellcheck -s bash "$f"; done
for f in $(find home -name '*.zsh' -o -name 'dot_zshrc' -o -name 'dot_zshenv'); do zsh -n "$f"; done
for cfg in tests/*.toml; do
  echo "== $cfg"
  render() { chezmoi --config "$cfg" --source . execute-template < "$1"; }
  for f in home/.chezmoiscripts/*.tmpl; do render "$f" > "$tmp/script.sh"; shellcheck -s bash "$tmp/script.sh"; done
  for f in home/.chezmoiscripts/*.sh; do shellcheck -s bash "$f"; done
  for f in $(find home -name '*.tmpl' -not -path '*/.chezmoiscripts/*' -not -name '.chezmoi.toml.tmpl'); do
    render "$f" > "$tmp/out"
    case "$f" in
      */git/config.tmpl) git config --file "$tmp/out" --list > /dev/null ;;
      *.zsh.tmpl|*dot_zprofile.tmpl) zsh -n "$tmp/out" ;;
      *.plist.tmpl) plutil -lint "$tmp/out" > /dev/null ;;
    esac
  done
done
PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=home/dot_local/lib python3 -m unittest discover -s tests/op_dedupe -t . -q
echo "check ok"
'''

[tasks.render]
description = "Print the rendered scripts for one machine"
usage = 'arg "<machine>" help="athena or nabla-mac-raphael"'
run = '''
for f in home/.chezmoiscripts/*.tmpl home/dot_config/mise/config.toml.tmpl; do
  echo "##### $f"
  chezmoi --config "tests/${usage_machine}.toml" --source . execute-template < "$f"
done
'''

[tasks.upstream-check]
description = "Check whether upstream bugs worked around in this repo are fixed (kotlin-lsp Homebrew formula)"
run = "scripts/check-upstream.sh"

[tasks.bump-pins]
description = "Bump pinned versions (mise pins, gh skills) in packages.yaml; --dry-run only prints"
run = "python3 scripts/bump-pins.py"

[tasks.docs]
description = "Regenerate docs/tools.md from the package data and docs/tool-descriptions.yaml"
run = "python3 scripts/gen-tools-doc.py"
